openapi: 3.0.2
info:
  title: Real-Time Metrics APIs
  version: 9.1.2.0
  license:
    name: 'Copyright © 2025-26 Broadcom Inc. and/or its subsidiaries. All Rights Reserved.'
  description: |
    The Real-Time Metrics component provides Prometheus-compatible APIs for querying real time metrics collected from VMware vCenter environments. These APIs enable you to execute PromQL queries, retrieve metric metadata, and manage vCenter metrics configuration.

    ## Authentication

    All API requests require a valid JWT Bearer token in the Authorization header. Access is restricted to resources that the authenticated user is authorized to view or modify.

    ### Obtaining a Token

    1. **Acquire an OpsToken** by calling:
       ```
       POST https://<vcf-operations-fqdn>/suite-api/api/auth/token/acquire
       Content-Type: application/json

       {
         "username": "<username>",
         "password": "<password>"
       }
       ```
       This returns an OpsToken in the response.

    2. **Get the Real-Time metrics Service Key**(service-key) by calling the integrations API (find the key where type = VCF_VODAP):
       ```
       GET https://<vcf-operations-fqdn>/suite-api/api/integrations/services
       Authorization: OpsToken <ops-token>
       ```

    3. **Exchange the Service Key for a JWT Token** by calling the VCF Operations API:
       ```
       POST https://<vcf-operations-fqdn>/suite-api/api/auth/token/exchange
       Content-Type: application/json
       Authorization: OpsToken <ops-token>

       {
         "serviceKeys": ["<service-key>"]
       }
       ```

    ### Using the Token

    Include the JWT token in the Authorization header:
    ```
    Authorization: Bearer <jwt-token>
    ```
servers:
  - url: 'https://{vcf-operations-fqdn}/'
    variables:
      vcf-operations-fqdn:
        description: FQDN of the VCF Operations instance.
        default: ''
paths:
  '/api/v1/query':
    get:
      tags:
        - prometheus-expression
      summary: Execute instant PromQL query.
      description: Executes a PromQL query and returns the result.
      operationId: query
      parameters:
        - $ref: '#/components/parameters/queryQueryParam'
        - $ref: '#/components/parameters/sourceIdRequiredQueryParam'
        - $ref: '#/components/parameters/timeQueryParam'
        - $ref: '#/components/parameters/timeoutQueryParam'
        - $ref: '#/components/parameters/limitQueryParam'
        - $ref: '#/components/parameters/externalTagsFilterQueryParam'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrometheusResponse"
        '400':
          description: Bad request.
          x-vmw-compiler-skip: true
        '401':
          description: Unauthorized.
          x-vmw-compiler-skip: true
        '403':
          description: Forbidden.
          x-vmw-compiler-skip: true
        '422':
          description: Unprocessable Entity.
          x-vmw-compiler-skip: true
        '503':
          description: Service Unavailable.
          x-vmw-compiler-skip: true
    post:
      tags:
        - prometheus-expression
      description: Executes a PromQL query and returns the result. Accepts parameters as a form-urlencoded request body.
      operationId: queryPost
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - query
                - sourceId
              properties:
                query:
                  type: string
                  description: The PromQL query for execution.
                  example: "jvm_gc_collection_seconds_count{service=\"server\"}"
                sourceId:
                  type: string
                  description: Source Id against which we need to query data for, like VC Instance UUID, NSX Id etc.
                  example: 59e196ae-45c9-4bff-8176-5e6812435f8a
                time:
                  type: string
                  description: |
                    Evaluation timestamp in Unix epoch seconds or RFC3339 format.
                    The current server time is used if the time parameter is unset.
                  example: "1739780198"
                timeout:
                  type: string
                  description: Evaluation timeout in duration.
                  example: "1s"
                limit:
                  type: integer
                  format: int32
                  description: |
                    Maximum number of returned series. Doesn't affect scalars or strings but truncates the number of series for matrices
                    and vectors. If not set, default limit is applied.
                  example: 100
                externalTagsFilter:
                  type: string
                  description: Additionally passed tag filters which are needed to be applied on provided promql in request.
                  example: "{\"host\":\"host-15\", \"vm\":\"vm-25\"}"
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrometheusResponse"
        '400':
          description: Bad request.
          x-vmw-compiler-skip: true
        '401':
          description: Unauthorized.
          x-vmw-compiler-skip: true
        '403':
          description: Forbidden.
          x-vmw-compiler-skip: true
        '422':
          description: Unprocessable Entity.
          x-vmw-compiler-skip: true
        '503':
          description: Service Unavailable.
          x-vmw-compiler-skip: true
