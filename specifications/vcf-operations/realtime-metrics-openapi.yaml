components:
  parameters:
    queryQueryParam:
      name: query
      in: query
      description: The PromQL query for execution.
      required: true
      style: form
      explode: true
      schema:
        type: string
      example: "jvm_gc_collection_seconds_count{service=\"server\"}"
    policyQueryParam:
      name: policy
      in: query
      description: |
        Name of the policy for which the aggregated or rolled-up data to be queried.
      required: true
      style: form
      explode: true
      schema:
        type: string
      example: "TROUBLESHOOTING"
    sourceIdRequiredQueryParam:
      name: sourceId
      in: query
      description: The source identifier to query data for, such as a vCenter instance UUID or NSX ID.
      required: true
      style: form
      explode: true
      schema:
        type: string
        example: 59e196ae-45c9-4bff-8176-5e6812435f8a
    timeQueryParam:
      name: time
      in: query
      description: |
        Evaluation timestamp in Unix epoch seconds or RFC3339 format.
        The current server time is used if the time parameter is unset.
      required: false
      style: form
      explode: true
      schema:
        type: string
      example: "1739780198"
    timeoutQueryParam:
      name: timeout
      in: query
      description: Evaluation timeout in duration.
      required: false
      style: form
      explode: true
      schema:
        type: string
      example: "1s"
    startQueryParam:
      name: start
      in: query
      description: Start timestamp in Unix epoch seconds or RFC3339 format.
      required: true
      style: form
      explode: true
      schema:
        type: string
      example: "1739780198"
    endQueryParam:
      name: end
      in: query
      description: End timestamp in Unix epoch seconds or RFC3339 format.
      required: true
      style: form
      explode: true
      schema:
        type: string
      example: "1739780198"
    stepQueryParam:
      name: step
      in: query
      description: Query resolution step width in duration format or float number of seconds.
      required: true
      style: form
      explode: true
      schema:
        type: string
      example: "1s"
    limitQueryParam:
      name: limit
      in: query
      description: |
        Maximum number of returned series. Doesn't affect scalars or strings but truncates the number of series for matrices
        and vectors. If not set, default limit is applied.
      required: false
      style: form
      explode: true
      schema:
        type: integer
        format: int32
      example: 100
    metadataLimitQueryParam:
      name: limit
      in: query
      description: |
        Maximum number of results to return. Behaviour:
        - Omitted or null: default of 500 is applied.
        - `-1`: no limit; all matching results are returned.
        - `1–10000`: used as-is.
        - `> 10000`: silently capped to 10000.
        - `0` or any other negative value: rejected with 400.
      required: false
      style: form
      explode: true
      schema:
        type: integer
        format: int32
      example: 100
    sourceIdQueryParam:
      name: sourceId
      in: query
      description: The source identifier to query data for, such as a vCenter instance UUID or NSX ID.
      required: false
      style: form
      explode: true
      schema:
        type: string
        example: 59e196ae-45c9-4bff-8176-5e6812435f8a
    externalTagsFilterQueryParam:
      name: externalTagsFilter
      in: query
      description: Additional tag filters to be applied to the provided PromQL query.
      required: false
      style: form
      explode: true
      schema:
        type: string
        example: "{\"host\":\"host-15\", \"vm\":\"vm-25\"}"
    metricNameQueryParam:
      name: metric
      in: query
      description: Metric name.
      required: false
      style: form
      explode: true
      schema:
        type: string
        example: cpu.usage.HOST
    vcIdPathParam:
      name: vcId
      in: path
      description: UUID of the vCenter Server instance.
      required: true
      schema:
        type: string
        format: uuid
        example: 1725ff48-ab45-4bb5-9d02-88745177dedb
    labelNamePathParam:
      name: label_name
      in: path
      required: true
      description: Name of the label
      schema:
        type: string
      example: "__name__"
    matchQueryParam:
      name: match
      in: query
      required: false
      description: |
        Series selectors to filter results (optional). To receive non-empty results, at least one
        selector must identify a metric by name — either as a bare name (e.g. `cpu.usage.HOST`) or
        via the `__name__` label (e.g. `{__name__="cpu.usage.HOST"}`). Selectors that contain only
        tag/label matchers without a metric name (e.g. `{host="host-15"}`) will produce an empty
        response.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      example: ["cpu.usage.HOST", "mem.consumed.HOST"]
    matchRequiredQueryParam:
      name: match
      in: query
      required: true
      description: |
        Series selectors used to filter results (required). To receive non-empty results, at least
        one selector must identify a metric by name — either as a bare name (e.g. `cpu.usage.HOST`)
        or via the `__name__` label (e.g. `{__name__="cpu.usage.HOST"}`). Selectors that contain
        only tag/label matchers without a metric name (e.g. `{host="host-15"}`) will produce an
        empty response.
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          type: string
      example: ["cpu.usage.HOST", "mem.consumed{cluster=\"prod\"}"]
    optionalStartQueryParam:
      name: start
      in: query
      description: Start timestamp in Unix epoch seconds or RFC3339 format.
      required: false
      style: form
      explode: true
      schema:
        type: string
      example: "1739780198"
    optionalEndQueryParam:
      name: end
      in: query
      description: End timestamp in Unix epoch seconds or RFC3339 format.
      required: false
      style: form
      explode: true
      schema:
        type: string
      example: "1739780198"
  schemas:
    PrometheusResponse:
      type: object
      required:
        - status
        - data
      description: Standard Prometheus response.
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        data:
          type: object
          description: Loose object reference for circumventing OpenAPI Generator's oneOf() problem for client SDK
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
        errorType:
          type: string
          description: |
            Type of an error.
            This field is set only if status is "error". The data field may still hold additional data.
        error:
          type: string
          description: |
            Error message returned when the query fails.
            This field is set only if status is "error". The data field may still hold additional data.
        warnings:
          type: array
          description: |
            Warnings generated during API execution.
            This field is set only if there were warnings while executing the request.
            The data field will still hold additional data.
          items:
            type: string
        infos:
          type: array
          description: |
            Info generated during API execution.
            This field is set only if there were info-level messages while executing the request.
          items:
            type: string
    Data:
      type: object
      required:
        - resultType
        - result
      properties:
        resultType:
          $ref: '#/components/schemas/ResultTypeEnum'
        result:
          type: object
          description: Loose object reference for circumventing OpenAPI Generator's oneOf() problem for client SDK
    # Range Vectors.
    Matrix:
      title: Matrix
      description: |
        Represents a Range Vector which is a set of time series containing a range of data points over time for each
        time series.
      type: array
      items:
        $ref: '#/components/schemas/Series'
    Series:
      type: object
      required:
        - metric
      description: List of data points for a metric.
      properties:
        metric:
          type: object
          additionalProperties:
            type: string
        values:
          type: array
          items:
            type: array
            items:
              type: object
            minItems: 2
            maxItems: 2
            description: Array containing timestamp (number) and metric value (string)
    # This is a copy to support array types in metric tag values.
    # JIRA: https://vmw-jira.broadcom.net/browse/VCOPS-41847
    # VODAP Adapter uses the OpenAPI spec generated models for response parsing
    # The "data-->result" is an Object Type.
    # The Client SDK parses the DQS response as an object.
    # The VODAP Adapter then models this "object" response into the "Series" model defined here.
    # This serialization is done to better leverage the generated model's fields, instead of playing with string keys
    # in Map datastructures.
    # The Series model above defines metrics tags as a String key, value pair.
    # It is possible to have an array value for a metric tag.
    # Below we mark the possible values as "object" type.
    SeriesAdapter:
      type: object
      required:
        - metric
      description: List of data points for a metric.
      properties:
        metric:
          type: object
          additionalProperties:
            type: object
        values:
          type: array
          items:
            type: array
            items:
              type: object
            minItems: 2
            maxItems: 2
            description: Array containing timestamp (number) and metric value (string)
    # Instant Vectors.
    Vector:
      title: Vector
      description: |
        Represents an Instant Vector which is a set of time series containing a single sample for each time series,
        all sharing the same timestamp.
      type: array
      items:
        $ref: '#/components/schemas/Sample'
    Sample:
      type: object
      required:
        - metric
      description: Single data point for a metric.
      properties:
        metric:
          type: object
          additionalProperties:
            type: string
        value:
          type: array
          items:
            type: object
          minItems: 2
          maxItems: 2
          description: Array containing timestamp (number) and metric value (string)
    # Scalar.
    Scalar:
      type: array
      items:
        type: object
      minItems: 2
      maxItems: 2
      description: Array containing timestamp (number) and metric value (string)
    # String.
    StringResult:
      type: array
      items:
        type: object
      minItems: 2
      maxItems: 2
      description: Array containing timestamp (number) and value (string)
    StatusEnum:
      type: string
      description: API execution status.
      enum: [success, error]
    ResultTypeEnum:
      type: string
      description: Type of a result.
      enum: [matrix, vector, scalar, string]
    MetricMetadataResponse:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/MetricMetadata'
    MetricMetadata:
      type: array
      items:
        $ref: '#/components/schemas/MetricMetadataItem'
    MetricMetadataItem:
      type: object
      properties:
        type:
          type: string
          description: The metric type (e.g., counter, gauge, etc.).
          example: cpu.usage.HOST
        help:
          type: string
          description: Description of the metric.
          example: CPU Usage Host is the measurement of how much of the CPU's capacity is being utilized by the host system.
        unit:
          type: string
          description: Unit of the metric (can be empty).
          example: percentage
      required:
        - type
        - help
        - unit
    VcMetricsConfigRequestBody:
      type: object
      properties:
        standard:
          type: boolean
          description: Enable/disable VC standard metrics.
        verbose:
          type: boolean
          description: Enable/disable VC verbose metrics.
        esxTopHostMoids:
          type: array
          items:
            $ref: '#/components/schemas/EsxTopHostMoidOperation'
      example:
        verbose: false
    EsxTopHostMoidOperation:
      type: object
      required:
        - moid
        - operation
      properties:
        moid:
          type: string
          description: The ESXi host MOID.
          example: "host-1"
        operation:
          type: string
          description: The operation to perform on the MOID.
          enum: [ADD, REMOVE]
          example: "ADD"
    PageInfo:
      type: object
      description: Pagination metadata for paginated responses.
      properties:
        nextPageToken:
          type: string
          description: Token for the next page of results. If null, there are no more pages.
          example: "eyJuYW1lIjoiY3B1LnVzYWdlIiwidGltZXN0YW1wIjoxNjAwMDAwMDAwfQ=="
        pageSize:
          type: integer
          description: Number of results requested per page.
          example: 50
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
