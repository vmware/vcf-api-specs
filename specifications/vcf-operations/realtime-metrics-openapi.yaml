    post:
      tags:
        - prometheus-metadata
      summary: Get label names
      description: Returns a list of label names for PromQL autocompletion. Accepts parameters as a form-urlencoded request body.
      operationId: getLabelsPost
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
